<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAY & MORE</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css');

:root{
  --paper:#FFFCF3;
  --dotgrid:#EAE2CC;
  --ink:#221D17;
  --ink-soft:#5A5347;
  --pink:#FFC9D6;
  --pink-d:#F79CB4;
  --blue:#BFE3FF;
  --blue-d:#8FCBFF;
  --mint:#C9F2D8;
  --mint-d:#8FE0B4;
  --yellow:#FFE79A;
  --yellow-d:#FFD65C;
  --lav:#E4D8FF;
  --lav-d:#C9B6FF;
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--paper);
  background-image:radial-gradient(circle, var(--dotgrid) 1.3px, transparent 1.3px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Pretendard', 'Malgun Gothic', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:760px;margin:0 auto;padding:0 18px 70px;min-height:100vh;}

h1,h2,.font-display{font-family:'Pretendard', 'Malgun Gothic', sans-serif; font-weight:700;}

/* ---- navbar ---- */
.navbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 26px;}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;font-weight:800;font-size:18px;letter-spacing:.01em;}
.nav-logo svg{width:30px;height:30px;flex:none;}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.nav-links a{
  font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;color:var(--ink);
  text-decoration:none;padding:8px 14px;border-radius:999px;border:2px solid transparent;
}
.nav-links a:hover{border-color:var(--ink);background:var(--card);}

/* ---- sketch base ---- */
.sketch{position:relative; border:2.5px solid var(--ink); z-index:0; background:var(--card);}
.sketch::before{content:'';position:absolute;inset:-5px;border:2px solid var(--ink);opacity:.28;border-radius:inherit;z-index:-1;}
.wob-1{border-radius:255px 18px 225px 30px/28px 225px 30px 255px;}
.wob-2{border-radius:22px 240px 24px 235px/235px 24px 240px 22px;}
.wob-3{border-radius:20px 235px 235px 20px/230px 20px 20px 230px;}
.tilt-1{transform:rotate(-1.1deg);}
.tilt-2{transform:rotate(0.9deg);}
.tilt-3{transform:rotate(-0.6deg);}

.sticker-tag{
  display:inline-block; font-family:'Pretendard', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;
  background:var(--pink); border:2px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
  padding:3px 14px; transform:rotate(-2deg); margin-bottom:14px;
}

h1{font-size:clamp(28px,6.4vw,40px); line-height:1.3; margin:10px 0 14px;}
h1 .hl{color:var(--ink); text-decoration:underline; text-decoration-style:wavy; text-decoration-color:var(--pink-d); text-decoration-thickness:3px; text-underline-offset:5px;}
p.lede{font-size:16px; line-height:1.65; color:var(--ink-soft); max-width:52ch; margin:0 0 12px;}

/* ---- buttons ---- */
.btn{
  appearance:none; cursor:pointer; font-family:'Pretendard', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;
  border:2.5px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
  padding:12px 20px; background:#fff; box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
  text-decoration:none; color:var(--ink); display:inline-block;
}
.btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
.btn:active{transform:translate(0,0); box-shadow:1px 1px 0 var(--ink);}
.btn-primary{background:var(--yellow);}
.btn-small{padding:9px 16px; font-size:13px; white-space:nowrap;}

.foot{text-align:center;padding:50px 24px 70px;color:var(--ink-soft);font-size:14px;}
.section-block{max-width:1040px;margin:0 auto;padding:64px 24px;}
.section-kicker{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 8px;}
.section-title{font-size:30px;font-weight:900;margin:0 0 10px;}
.section-sub{font-size:15.5px;color:var(--ink-soft);margin:0 0 32px;line-height:1.6;}
.saylist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.saylist-card{display:block;background:var(--card);border-radius:20px;padding:26px;text-decoration:none;color:var(--ink);}
.saylist-card .sl-emoji{font-size:30px;display:block;margin-bottom:12px;}
.saylist-card .sl-title{font-weight:800;font-size:17px;margin-bottom:6px;}
.saylist-card .sl-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.play-list{display:flex;flex-direction:column;gap:20px;}
.play-card{background:var(--card);border-radius:20px;padding:28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.play-card .play-emoji{font-size:28px;line-height:1;}
.play-card .play-body{flex:1;min-width:220px;}
.play-card .play-title{font-weight:800;font-size:17px;margin-bottom:6px;}
.play-card .play-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
@media (max-width:640px){
  .saylist-grid{grid-template-columns:1fr;}
  .play-card{flex-direction:column;align-items:flex-start;}
  .play-card .btn{width:100%;text-align:center;}
}

.hero-clean{padding:8px 0 40px;}
.hero-label{display:inline-block;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:5px 16px;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--ink);margin-bottom:22px;}
.hero-heading{font-size:clamp(19px,3.6vw,23px);font-weight:600;line-height:1.65;margin:0;letter-spacing:-.01em;color:var(--ink);}
</style>
<style>
/* ---- sections ---- */
.section-block{margin-top:56px;scroll-margin-top:24px;}
.section-kicker{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;margin:0 0 4px;}
.section-title{font-size:26px;font-weight:800;margin:0 0 8px;}
.section-sub{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 24px;max-width:56ch;}

/* ---- SAYLIST grid ---- */
.saylist-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.saylist-card{display:block;padding:22px 20px;text-decoration:none;color:inherit;}
.saylist-card .sl-emoji{font-size:26px;display:block;margin-bottom:10px;}
.saylist-card .sl-title{font-size:16.5px;font-weight:800;margin-bottom:6px;}
.saylist-card .sl-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
@media (max-width:520px){ .saylist-grid{grid-template-columns:1fr;} }

/* ---- SAY PLAY cards ---- */
.play-list{display:flex;flex-direction:column;gap:16px;}
.play-card{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 24px;}
.play-card .play-emoji{font-size:30px;flex:none;}
.play-card .play-body{flex:1;min-width:220px;}
.play-card .play-title{font-size:17px;font-weight:800;margin-bottom:6px;}
.play-card .play-desc{font-size:13px;color:var(--ink-soft);line-height:1.55;}

footer.foot{text-align:center; margin-top:56px; font-size:12px; color:var(--ink-soft); font-family:'Pretendard', 'Malgun Gothic', sans-serif;}

/* ---- main carousel ---- */
.carousel{position:relative;margin:26px 0 34px;border-radius:24px;overflow:hidden;background:var(--card);}
.carousel-track{display:flex;width:300%;transition:transform .45s cubic-bezier(.65,0,.35,1);touch-action:pan-y;}
.carousel-slide{width:33.3333%;flex:none;}
.slide-visual{display:flex;align-items:center;justify-content:space-between;padding:34px 28px;min-height:120px;}
.slide-emoji{font-size:46px;line-height:1;}
.slide-word{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:-.02em;color:var(--ink);opacity:.82;}
.slide-list .slide-visual{background:#D8B5B0;}
.slide-play .slide-visual{background:#AFC3C8;}
.slide-about .slide-visual{background:#AEB8A3;}
.slide-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;flex-wrap:wrap;}
.slide-list .slide-bar{background:#B89A96;}
.slide-play .slide-bar{background:#95A6AA;}
.slide-about .slide-bar{background:#949C8B;}
.slide-bar-title{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.5;margin:0;}
.slide-cta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink);text-decoration:none;background:var(--card);padding:8px 14px;border-radius:999px;white-space:nowrap;}
.carousel-arrow{position:absolute;top:60px;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:var(--card);color:var(--ink);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(34,29,23,.18);z-index:2;padding:0;}
.carousel-arrow.prev{left:12px;}
.carousel-arrow.next{right:12px;}
.carousel-dots{position:absolute;left:50%;top:98px;transform:translateX(-50%);display:flex;gap:6px;z-index:2;}
.dot{width:7px;height:7px;border-radius:50%;border:none;background:rgba(34,29,23,.4);padding:0;cursor:pointer;}
.dot.active{background:var(--ink);width:18px;border-radius:4px;}
</style>
</head>
