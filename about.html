<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT · SAY & MORE</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css');

:root{
  --paper:#FFFCF3;
  --dotgrid:#EAE2CC;
  --ink:#221D17;
  --ink-soft:#5A5347;
  --pink:#FFC9D6;
  --pink-d:#F79CB4;
  --blue:#BFE3FF;
  --blue-d:#8FCBFF;
  --mint:#C9F2D8;
  --mint-d:#8FE0B4;
  --yellow:#FFE79A;
  --yellow-d:#FFD65C;
  --lav:#E4D8FF;
  --lav-d:#C9B6FF;
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--paper);
  background-image:radial-gradient(circle, var(--dotgrid) 1.3px, transparent 1.3px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Pretendard', 'Malgun Gothic', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:760px;margin:0 auto;padding:0 18px 70px;min-height:100vh;}
h1,h2,.font-display{font-family:'Pretendard', 'Malgun Gothic', sans-serif; font-weight:700;}

.navbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 26px;}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;font-weight:800;font-size:18px;}
.nav-logo svg{width:30px;height:30px;flex:none;}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.nav-links a{font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;border:2px solid transparent;}
.nav-links a:hover{border-color:var(--ink);background:var(--card);}
.nav-links a.current{border-color:var(--ink);background:var(--yellow);}

.sketch{position:relative; border:2.5px solid var(--ink); z-index:0; background:var(--card);}
.sketch::before{content:'';position:absolute;inset:-5px;border:2px solid var(--ink);opacity:.28;border-radius:inherit;z-index:-1;}
.wob-1{border-radius:255px 18px 225px 30px/28px 225px 30px 255px;}
.wob-2{border-radius:22px 240px 24px 235px/235px 24px 240px 22px;}
.wob-3{border-radius:20px 235px 235px 20px/230px 20px 20px 230px;}
.tilt-1{transform:rotate(-1.1deg);}
.tilt-2{transform:rotate(0.9deg);}
.tilt-3{transform:rotate(-0.6deg);}

.sticker-tag{display:inline-block; font-family:'Pretendard', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;background:var(--lav); border:2px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;padding:3px 14px; transform:rotate(-2deg); margin-bottom:14px;}
h1{font-size:clamp(28px,6.4vw,38px); line-height:1.3; margin:10px 0 14px;}
p.lede{font-size:16px; line-height:1.65; color:var(--ink-soft); max-width:56ch; margin:0 0 30px;}

.btn{appearance:none; cursor:pointer; font-family:'Pretendard', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;border:2.5px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;padding:12px 20px; background:#fff; box-shadow:3px 3px 0 var(--ink);transition:transform .12s ease, box-shadow .12s ease;text-decoration:none; color:var(--ink); display:inline-block;}
.btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
.btn-primary{background:var(--yellow);}

.foot{text-align:center;padding:50px 24px 70px;color:var(--ink-soft);font-size:14px;}
.section-block{max-width:1040px;margin:0 auto;padding:64px 24px;}
.section-kicker{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 8px;}
.section-title{font-size:30px;font-weight:900;margin:0 0 10px;}
.section-sub{font-size:15.5px;color:var(--ink-soft);margin:0 0 32px;line-height:1.6;}
.role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.role-card{background:var(--card);border-radius:20px;padding:26px 20px;text-align:center;}
.role-card .role-emoji{font-size:30px;display:block;margin-bottom:12px;}
.role-card .role-name{font-weight:900;font-size:16px;margin-bottom:8px;letter-spacing:.02em;}
.role-card .role-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;}
@media (max-width:860px){.role-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.role-grid{grid-template-columns:1fr;}}

/* ---- about hero split ---- */
.about-hero{display:flex;min-height:420px;border-radius:24px;overflow:hidden;margin:26px 0 34px;}
.about-left,.about-right{flex:1 1 50%;display:flex;flex-direction:column;justify-content:center;padding:48px 40px;}
.about-left{background:#AFC3C8;}
.about-right{background:#E4D19A;}
.about-word{font-weight:800;font-size:clamp(38px,6vw,64px);line-height:1.15;letter-spacing:-.02em;margin:0;color:var(--ink);}
.about-word .accent{color:#E4D19A;}
.about-desc{font-size:clamp(17px,2.2vw,21px);font-weight:600;line-height:1.7;color:var(--ink);margin:0;}
@media (max-width:640px){
  .about-hero{flex-direction:column;min-height:0;}
  .about-left,.about-right{padding:36px 26px;}
}
</style>
</head>
