<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>육아답</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap');

:root{
  --paper:#FFFCF3;
  --dotgrid:#EAE2CC;
  --ink:#221D17;
  --ink-soft:#5A5347;
  --pink:#FFC9D6;
  --pink-d:#F79CB4;
  --blue:#BFE3FF;
  --blue-d:#8FCBFF;
  --mint:#C9F2D8;
  --mint-d:#8FE0B4;
  --yellow:#FFE79A;
  --yellow-d:#FFD65C;
  --lav:#E4D8FF;
  --lav-d:#C9B6FF;
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--paper);
  background-image:radial-gradient(circle, var(--dotgrid) 1.3px, transparent 1.3px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:720px;margin:0 auto;padding:30px 18px 70px;min-height:100vh;}

h1,h2,.font-display{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-weight:700;}

/* ---- brand ---- */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:36px;}
.brand a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand svg{width:34px;height:34px;flex:none;}
.brand-name{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif;font-size:18px;font-weight:700;}

/* ---- sketch base ---- */
.sketch{position:relative; border:2.5px solid var(--ink); z-index:0; background:var(--card);}
.sketch::before{content:'';position:absolute;inset:-5px;border:2px solid var(--ink);opacity:.28;border-radius:inherit;z-index:-1;}
.wob-1{border-radius:255px 18px 225px 30px/28px 225px 30px 255px;}
.wob-2{border-radius:22px 240px 24px 235px/235px 24px 240px 22px;}
.tilt-1{transform:rotate(-1.1deg);}
.tilt-2{transform:rotate(0.9deg);}

.sticker-tag{
  display:inline-block; font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;
  background:var(--pink); border:2px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
  padding:3px 14px; transform:rotate(-2deg); margin-bottom:14px;
}

h1{font-size:clamp(28px,6.4vw,42px); line-height:1.28; margin:0 0 14px;}
h1 .hl{color:var(--ink); text-decoration:underline; text-decoration-style:wavy; text-decoration-color:var(--pink-d); text-decoration-thickness:3px; text-underline-offset:5px;}
p.lede{font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:52ch; margin:0 0 34px;}

/* ---- buttons ---- */
.btn{
  appearance:none; cursor:pointer; font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;
  border:2.5px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
  padding:13px 20px; background:#fff; box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
  text-decoration:none; color:var(--ink); display:inline-block;
}
.btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
.btn:active{transform:translate(0,0); box-shadow:1px 1px 0 var(--ink);}
.btn-primary{background:var(--yellow);}
.btn-small{padding:9px 16px; font-size:13px; white-space:nowrap;}
.btn-soon{background:#EFEAD8; color:var(--ink-soft); cursor:default; box-shadow:none;}

/* ---- project links ---- */
.project-links{display:flex; flex-direction:column; gap:16px;}
.project-link-card{
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:22px 24px;
}
.project-link-name{font-size:19px; font-weight:700;}

footer.foot{text-align:center; margin-top:44px; font-size:12px; color:var(--ink-soft); font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif;}
</style>
</head>
<body>
<div class="app">

<div class="brand">
<a href="index.html">
<svg viewBox="0 0 64 64"><circle cx="32" cy="36" r="20" fill="#FFF6E0" stroke="var(--ink)" stroke-width="2.5"/><circle cx="24" cy="34" r="2" fill="var(--ink)"/><circle cx="40" cy="34" r="2" fill="var(--ink)"/><path d="M24 44 Q32 50 40 44" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><path d="M28 14 Q32 6 36 14" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="18" cy="40" rx="3" ry="2" fill="var(--pink)"/><ellipse cx="46" cy="40" rx="3" ry="2" fill="var(--pink)"/></svg>
<div class="brand-name">육아답</div>
</a>
</div>

<span class="sticker-tag">🍼 육아답 프로젝트 모음</span>
<h1>육아템, 뭐가 좋을지<br>고민될 때마다 <span class="hl">육아답</span></h1>
<p class="lede">육아답은 육아용품 고르기를 도와주는 작은 프로젝트들을 만들어가는 공간이에요. 취향 매치, 비교, 체크리스트 같은 프로젝트들이 하나씩 늘어날 예정이에요.</p>

<div class="project-links">
<div class="project-link-card sketch wob-1 tilt-1">
<span class="project-link-name">육아템 매치</span>
<a class="btn btn-primary btn-small" href="projects.html">프로젝트 보러 가기 →</a>
</div>
<div class="project-link-card sketch wob-2 tilt-2">
<span class="project-link-name">육아고사</span>
<a class="btn btn-primary btn-small" href="https://yuk-gosa.vercel.app" target="_blank" rel="noopener">프로젝트 보러 가기 →</a>
</div>
<div class="project-link-card sketch wob-3 tilt-3">
<span class="project-link-name">육아지도</span>
<a class="btn btn-primary btn-small" href="https://yuk-map.vercel.app" target="_blank" rel="noopener">프로젝트 보러 가기 →</a>
</div>
</div>

<footer class="foot">☁ 육아답 · 육아템 고르기를 도와드려요 ☁</footer>
</div>
</body>
</html>
